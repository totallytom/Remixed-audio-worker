[project]
name = "remixed-audio-worker"
version = "0.1.0"
description = "Audio analysis worker for Re-Mixed: real waveforms, loudness and duplicate-upload detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
audio-worker = "audio_worker.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom: Depends()/Header() in parameter defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
